# Review Pulse — Render Configuration
services:
  - type: web
    name: review-pulse-api
    runtime: python
    rootDir: Phase 4
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: GOOGLE_OAUTH_TOKEN_B64
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        # Set to your Vercel URL after frontend deploys (e.g.
        # "https://review-lens.vercel.app"). Comma-separated for multiple.
        # Default "*" stays open until you fill this in.
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONPATH
        value: .
    healthCheckPath: /api/health
