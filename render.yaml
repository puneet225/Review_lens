# Review Pulse — Render Configuration
services:
  - type: web
    name: review-pulse-api
    runtime: python
    rootDir: Phase 3
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: GOOGLE_OAUTH_TOKEN_B64
        sync: false
      - key: PYTHONPATH
        value: .
    healthCheckPath: /api/health
